# =============================================================================
#  nes.cfg — configuration de l'éditeur de liens (ld65)
# =============================================================================
#  Ce fichier décrit COMMENT assembler le fichier .nes final :
#  quelles zones mémoire existent, et quel morceau de code va où.
#
#  MEMORY : les "conteneurs" physiques.
#    - HEADER : les 16 octets d'en-tête du format iNES ;
#    - PRG    : la ROM de code, vue par le CPU aux adresses $8000-$FFFF ;
#    - CHR    : la ROM de graphismes (8 Ko), vue par le PPU ;
#    - ZP     : la page zéro (RAM rapide, adresses $00-$FF) ;
#    - RAM    : la RAM ordinaire. Elle commence ici à $0300 car la page
#               $0200-$02FF est réservée au brouillon des sprites.
#
#  SEGMENTS : les morceaux nommés dans le .s (.segment "..."), et le
#  conteneur dans lequel chacun est rangé. VECTORS est forcé tout à la
#  fin de la ROM ($FFFA), là où le CPU vient chercher ses adresses de
#  démarrage.

MEMORY {
    HEADER: start = $0000, size = $0010, fill = yes;
    PRG:    start = $8000, size = $8000, fill = yes, fillval = $FF;
    CHR:    start = $0000, size = $2000, fill = yes, fillval = $00;
    ZP:     start = $0000, size = $0100, type = rw;
    RAM:    start = $0300, size = $0500, type = rw;
}

SEGMENTS {
    HEADER:   load = HEADER, type = ro;
    CODE:     load = PRG,    type = ro;
    VECTORS:  load = PRG,    type = ro, start = $FFFA;
    CHR:      load = CHR,    type = ro;
    ZEROPAGE: load = ZP,     type = zp;
    BSS:      load = RAM,    type = bss;
}
