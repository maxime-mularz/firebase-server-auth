# CRISTAL-2026 : une cartouche LoROM de 256 Ko — HUIT banques de 32 Ko.
#
# Nos jeux précédents tenaient dans UNE banque ($8000-$FFFF de la banque 0).
# Un RPG ne tient plus : le CODE reste en banque 0 (les vecteurs d'interruption
# DOIVENT y être), les DONNÉES déménagent dans les banques hautes ($81, $82...),
# lues par ADRESSAGE LONG (lda f:..., 24 bits). Les banques 2 à 7 sont encore
# vides : elles attendent les cartes, les monstres et les dialogues des
# prochaines phases.
#
# Et la nouveauté qui change tout : la SRAM ($70:0000, 8 Ko), alimentée par
# une pile dans la vraie cartouche — la sauvegarde qui survit à l'extinction.
MEMORY {
    ZP:   start = $0000,   size = $0100, type = rw;
    RAM:  start = $0440,   size = $1000, type = rw;
    ROM0: start = $8000,   size = $8000, fill = yes, fillval = $00;  # code
    ROM1: start = $818000, size = $8000, fill = yes, fillval = $00;  # données
    ROM2: start = $828000, size = $8000, fill = yes, fillval = $00;
    ROM3: start = $838000, size = $8000, fill = yes, fillval = $00;
    ROM4: start = $848000, size = $8000, fill = yes, fillval = $00;
    ROM5: start = $858000, size = $8000, fill = yes, fillval = $00;
    ROM6: start = $868000, size = $8000, fill = yes, fillval = $00;
    ROM7: start = $878000, size = $8000, fill = yes, fillval = $00;
}
SEGMENTS {
    CODE:       load = ROM0;
    RODATA:     load = ROM0;
    SNESHEADER: load = ROM0, start = $FFC0;
    VECTORS:    load = ROM0, start = $FFE0;
    DONNEES:    load = ROM1;
    ZEROPAGE:   load = ZP,  type = zp;
    BSS:        load = RAM, type = bss;
}
